[project]
name = "jouzetsu"
version = "1.0.0"
description = "Async web interface for LM Studio built with FastHTML"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "markdown-it-py>=4.0.0",
    "pillow>=12",
    "python-fasthtml>=0.14.9,<0.15",
    "uvicorn>=0.35",
]

[project.scripts]
jouzetsu = "jouzetsu.__main__:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jouzetsu*"]

[tool.setuptools.package-data]
jouzetsu = [
    "config/default_data/*.json",
    "character_preset_data/*.json",
    "web/static/app.js",
    "web/static/app/*.js",
    "web/static/fallback-icon.svg",
    "web/static/theme/*.css",
    "web/static/fonts/*.otf",
    "web/static/fonts/*.ttf",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37",
    "httpx>=0.28",
    "playwright>=1.58",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.uv]
# The application environment and uv cache can reside on different filesystems.
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Fastcore still uses this deprecated helper (verified through 2.2.39).
    # Remove when upstream switches to inspect.iscoroutinefunction.
    "ignore:^'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16; use inspect\\.iscoroutinefunction\\(\\) instead$:DeprecationWarning:^fastcore\\.xtras$",
]
markers = [
    "browser: Playwright coverage for stateful browser interactions",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
